[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
from = "/QR-Landing-page"
to = "/QR-Landing-page/index.html"
status = 200

[[redirects]]
from = "/QR-Landing-page/"
to = "/QR-Landing-page/index.html"
status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
